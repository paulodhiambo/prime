apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prime
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paulodhiambo/prime.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
